# worktree 共享清单 —— 根工作区里被 gitignore 排除、但每个任务 worktree 都需要的本机资产。
#
# 一行一个相对仓根的路径前缀（目录可带尾斜杠），# 开头为注释。
# scripts/worktree.sh link（及 bootstrap 安装的 post-checkout 钩子）把根工作区中落在这些前缀下的
# 被忽略条目软链进 worktree：不复制、不入库，写入落回根工作区，所有 worktree 共用一份。
#   前缀整个被忽略的（state/collectors、.claude/settings.local.json）：一条软链；
#   前缀本身入库的（repos/ 有 .gitkeep，wiki/private/ 有 README）：只链其下被忽略的条目。
# 约束：对应的 .gitignore 目录规则不得带尾斜杠——尾斜杠只匹配真实目录，worktree 里的软链会变成未跟踪文件。
# 实例可在文末追加自己的前缀（如采集正文目录）；模板升级按 merge 合并本文件。
repos/
state/collectors/
wiki/private/
.claude/settings.local.json
# 模板维护者的本地敏感词表（release-check 用），普通实例没有此文件、自动跳过
.release-check-local
